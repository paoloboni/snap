name: CI

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Implementation ────────────────────────────────────────────────────────
  # Proves: strict type-check, lint, formatting, unit/property suite
  implementation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit / property tests
        run: npm test

  # ── 2. Harness ───────────────────────────────────────────────────────────────
  # Proves: the test harness itself type-checks and passes its own tests
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-harness
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: test-harness/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check harness
        run: npm run check

      - name: Harness self-tests
        run: npm test

  # ── 3. Acceptance ────────────────────────────────────────────────────────────
  # Proves: full language-neutral suite against a freshly installed workspace
  # Runs on both ubuntu-latest and macos-latest (§14.3)
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          # No npm cache: verify installs its own locked deps

      - name: Run acceptance suite
        id: run_verify
        shell: bash
        run: |
          set +e
          ./verify --lang ts --summary acceptance-summary.txt
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 2 ]; then
            echo "::error::Harness error (exit code 2) — not a test failure"
            exit 2
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "verify_failed=true" >> "$GITHUB_OUTPUT"
            exit $EXIT_CODE
          fi

      - name: Re-run with --keep-failed to capture sandbox paths
        if: failure() && steps.run_verify.outputs.verify_failed == 'true'
        shell: bash
        run: |
          set +e
          ./verify --lang ts --keep-failed
          set -e
          true  # don't propagate a second non-zero exit; failure is already set

      - name: Upload acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-summary-${{ matrix.os }}
          path: acceptance-summary.txt
          if-no-files-found: ignore

  # ── 4. Commit-lint ───────────────────────────────────────────────────────────
  # Validates commit messages against Conventional Commits v1.0.0 (§13)
  # Only on push (not pull_request) to avoid duplicate runs
  commit-lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install commitlint
        run: |
          npm install --no-save \
            @commitlint/cli@latest \
            @commitlint/config-conventional@latest

      - name: Write commitlint config
        run: |
          cat > commitlint.config.cjs << 'EOF'
          module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'type-enum': [
                2,
                'always',
                [
                  'feat', 'fix', 'docs', 'test', 'refactor',
                  'perf', 'build', 'chore', 'ci', 'style'
                ]
              ],
              // scope-enum is intentionally disabled: primary module scopes
              // (core, repo, fsys, cli, present, net, commands, errors, tests,
              // harness, docs, bench, deps) are documented in PLAN.md §13, but
              // sub-scopes like docs(plan), docs(arch), build(config), test(fuzz)
              // are legitimate and cannot be exhaustively enumerated in advance.
              'scope-enum': [0],
              'scope-empty': [0, 'never']
            }
          };
          EOF

      - name: Lint commit messages
        run: |
          # Lint all commits in the push range; fall back to HEAD for tag pushes
          FROM="${{ github.event.before }}"
          TO="${{ github.event.after }}"

          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            # New branch or initial push — lint only the tip commit
            npx commitlint --config commitlint.config.cjs --last 1
          else
            npx commitlint --config commitlint.config.cjs --from "$FROM" --to "$TO"
          fi
