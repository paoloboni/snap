format: 1
name: revision integer boundaries and contributor ID length limits
steps:
  - run:
      args: [init, repo]
      expect: [{type: exit_code, value: 0}]
  - run:
      cwd: repo
      args: [config, contributor.id, a@x]
      expect: [{type: exit_code, value: 0}]

  # --- Revision 9007199254740992 (one over max safe integer) is rejected ---
  # The frontier uses a valid value (1); the patch revision is the overflow value.
  - write_file:
      path: repo/.snap/repository.json
      text: |
        {
          "format": 1,
          "frontier": [["a@x", 1]],
          "patches": [
            {
              "author": "a@x",
              "revision": 9007199254740992,
              "base": [],
              "message": "overflow",
              "changes": [{"type": "put", "path": "f", "content": "YQ=="}]
            }
          ]
        }
  - run:
      cwd: repo
      args: [status]
      expect:
        - {type: exit_code, value: 1}
        - {type: stdout_equals, value: ""}
        - {type: stderr_matches, pattern: '^snap: .+positive safe integer\n$'}

  # --- Frontier with 9007199254740992 is rejected (not a valid revision) ---
  - write_file:
      path: repo/.snap/repository.json
      text: |
        {
          "format": 1,
          "frontier": [["a@x", 9007199254740992]],
          "patches": []
        }
  - run:
      cwd: repo
      args: [status]
      expect:
        - {type: exit_code, value: 1}
        - {type: stdout_equals, value: ""}
        - {type: stderr_matches, pattern: '^snap: .+\n$'}

  # --- Revision 9007199254740991 (exactly max safe integer) is accepted at parse time ---
  # Use an empty repo (no patches) to verify format=1 passes.
  # After that, verify a simple single-patch repo parses successfully.
  - write_file:
      path: repo/.snap/repository.json
      text: |
        {"format": 1, "frontier": [], "patches": []}
  - run:
      cwd: repo
      args: [status]
      expect:
        - {type: exit_code, value: 0}
        - {type: stdout_equals, value: "version ()\n"}
        - {type: stderr_equals, value: ""}

  # --- CLI: (a@x->9007199254740991) is a syntactically valid version (but unknown) ---
  - run:
      cwd: repo
      args: [diff, "(a@x->9007199254740991)", "()"]
      expect:
        - {type: exit_code, value: 1}
        - {type: stdout_equals, value: ""}
        - {type: stderr_matches, pattern: '^snap: unknown version: .+\n$'}

  # --- CLI: (a@x->9007199254740992) is a syntactically invalid version ---
  - run:
      cwd: repo
      args: [diff, "(a@x->9007199254740992)", "()"]
      expect:
        - {type: exit_code, value: 1}
        - {type: stdout_equals, value: ""}
        - {type: stderr_matches, pattern: '^snap: invalid version: .+\n$'}

  # --- 254-byte contributor ID is valid (at limit) ---
  # 'a@' is 2 bytes; 252 'b' bytes = 254 total.
  - run:
      cwd: repo
      args: [config, contributor.id, "a@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"]
      expect:
        - {type: exit_code, value: 0}
        - {type: stdout_equals, value: ""}
        - {type: stderr_equals, value: ""}

  # --- 255-byte contributor ID is invalid (one over limit) ---
  # 'a@' = 2 bytes; 253 'b' bytes = 255 total — one too many.
  - run:
      cwd: repo
      args: [config, contributor.id, "a@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"]
      expect:
        - {type: exit_code, value: 1}
        - {type: stdout_equals, value: ""}
        - {type: stderr_matches, pattern: '^snap: invalid contributor id: .+\n$'}
